<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inseto Cards — Estrutura de Layout</title>
<!--
  Este arquivo é somente ARQUITETURA: divisão semântica em 4 regiões via
  CSS Grid (ver css/layout.css). Nenhuma cor, textura ou identidade visual
  é aplicada aqui — o objetivo é validar o esqueleto de posicionamento
  antes de entrar com o design final.
-->
<link rel="stylesheet" href="css/layout.css">
</head>
<body>

  <!-- Contêiner raiz: grid 3 colunas x 2 linhas que define as 4 regiões -->
  <div class="app-shell">

    <!-- ============================================================
         1) SEÇÃO ESQUERDA — Menu e Histórico
         Largura fixa, ocupa as duas linhas do grid (menu + histórico
         ficam sempre visíveis, independente do painel inferior central).
    ============================================================= -->
    <aside class="panel-menu" aria-label="Menu do jogador e histórico de jogadas">

      <div class="panel-menu__top">
        <nav class="player-menu" aria-label="Menu do jogador">
          <h2 class="panel-menu__title">Menu do Jogador</h2>

          <button type="button" class="btn btn-start-match">
            Iniciar Partida
          </button>

          <div class="field-group">
            <label for="playerName">Nome do jogador</label>
            <input id="playerName" name="playerName" type="text" autocomplete="off">
          </div>
        </nav>

        <div class="system-options" role="group" aria-label="Opções do sistema">
          <button type="button" class="btn btn-secondary">Regras</button>
          <button type="button" class="btn btn-danger">Abandonar Partida</button>
        </div>
      </div>

      <!-- Histórico: área que cresce e recebe scroll interno -->
      <section class="match-history" aria-label="Histórico de jogadas">
        <h3 class="match-history__title">Histórico</h3>
        <ul class="match-history__list">
          <li class="match-history__item">Jogador comprou uma carta</li>
          <li class="match-history__item">Jogador atacou o Banco inimigo</li>
          <li class="match-history__item">Oponente colheu folhas</li>
          <li class="match-history__item">Jogador posicionou carta no Banco</li>
          <li class="match-history__item">Oponente vendeu uma carta</li>
        </ul>
      </section>

    </aside>

    <!-- ============================================================
         2) SEÇÃO CENTRO-CIMA — Tabuleiro Principal
    ============================================================= -->
    <main class="board-main" aria-label="Tabuleiro principal">

      <div class="board-main__inner">

        <!-- Grid do tabuleiro: 8 slots de carta (Fronte/Banco dos dois jogadores) -->
        <div class="board-grid" aria-label="Slots de cartas em campo">
          <div class="board-slot" data-slot="p1-banco-1"></div>
          <div class="board-slot" data-slot="p1-banco-2"></div>
          <div class="board-slot" data-slot="p1-banco-3"></div>
          <div class="board-slot board-slot--front" data-slot="p1-fronte"></div>

          <div class="board-slot board-slot--front" data-slot="p2-fronte"></div>
          <div class="board-slot" data-slot="p2-banco-1"></div>
          <div class="board-slot" data-slot="p2-banco-2"></div>
          <div class="board-slot" data-slot="p2-banco-3"></div>
        </div>

        <!-- Zonas compartilhadas: Deck (Natureza) e Cemitério -->
        <div class="board-shared-zones" aria-label="Zonas compartilhadas">
          <div class="shared-zone shared-zone--deck" aria-label="Deck da Natureza">
            <span class="shared-zone__label">Natureza</span>
          </div>
          <div class="shared-zone shared-zone--graveyard" aria-label="Cemitério">
            <span class="shared-zone__label">Cemitério</span>
          </div>
        </div>

      </div>

    </main>

    <!-- ============================================================
         3) SEÇÃO CENTRO-BAIXO — Painel de Controle e Status
         Fica diretamente abaixo do tabuleiro, mesma coluna do grid.
    ============================================================= -->
    <section class="control-panel" aria-label="Painel de controle e status">

      <div class="status-indicators" aria-label="Indicadores de status">
        <div class="status-indicator status-indicator--chips">
          <span class="status-indicator__label">Folhas</span>
          <span class="status-indicator__value">5</span>
        </div>
        <div class="status-indicator status-indicator--actions">
          <span class="status-indicator__label">Ações restantes</span>
          <span class="status-indicator__value">2</span>
        </div>
      </div>

      <div class="action-buttons" role="group" aria-label="Ações do turno">
        <button type="button" class="btn btn-action">Mover</button>
        <button type="button" class="btn btn-action">Atacar</button>
        <button type="button" class="btn btn-action">Colher Folhas</button>
        <button type="button" class="btn btn-action">Vender Carta</button>
        <button type="button" class="btn btn-action">Comprar Carta</button>
      </div>

    </section>

    <!-- ============================================================
         4) SEÇÃO DIREITA — Exibição de Cartas
         Largura fixa, ocupa toda a altura da tela (as duas linhas).
    ============================================================= -->
    <aside class="card-display" aria-label="Exibição de cartas em destaque">
      <h2 class="card-display__title">Mão / Inspetor</h2>
      <div class="card-display__viewport" aria-label="Cartas em tamanho ampliado">
        <div class="card-display__slot"></div>
        <div class="card-display__slot"></div>
        <div class="card-display__slot"></div>
      </div>
    </aside>

  </div>

</body>
</html>
